            fill="url(#wingGrad)" stroke="#a9b7c9" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 660 328 C 700 350 738 386 774 430" fill="none" stroke="#c2cddd" stroke-width="2.4"/>
      <path d="M 654 344 C 692 366 730 400 764 442" fill="none" stroke="#c2cddd" stroke-width="2.4"/>
      <path d="M 668 360 C 700 380 730 410 756 444" fill="none" stroke="#c2cddd" stroke-width="2" opacity=".8"/>
      <path d="M 660 316 C 706 334 748 380 790 438" fill="none" stroke="#ffffff" stroke-width="6" opacity=".5" stroke-linecap="round"/>
      <!-- 翼端羽毛（搭在车把上） -->
      <path d="M 788 442 C 806 458 818 474 816 484 C 802 488 786 474 776 458 Z"
            fill="#f2f5fa" stroke="#a9b7c9" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M 770 424 C 790 444 806 466 810 480" fill="none" stroke="#a9b7c9" stroke-width="2" opacity=".8"/>
      <path d="M 808 428 C 822 432 830 442 826 450 C 818 452 810 444 804 436 Z"
            fill="#f7f9fc" stroke="#a9b7c9" stroke-width="2" stroke-linejoin="round"/>
    </g>

    <!-- ============================================================
         近侧腿：股骨 80，胫骨 162，踝点在踏板轴上方 16。
         膝关节被解算到身体轮廓之外（下方），因此画在身体之后即可。
         ============================================================ -->
    <g id="legNear">
      <g id="nearThigh">
        <path d="M -4 -14 C 22 -16 60 -12 80 -8 L 80 8 C 60 12 22 16 -4 14 Z"
              fill="url(#legGrad)" stroke="#b76a20" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M 16 -7 C 36 -9 58 -7 72 -5" fill="none" stroke="#ffdcae" stroke-width="3.6" opacity=".45" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="15" fill="#f4ab5e" stroke="#b76a20" stroke-width="2.4"/>
      </g>
      <g id="nearShin">
        <path d="M -4 -12 C 44 -14 120 -11 162 -6 L 162 6 C 120 11 44 14 -4 12 Z"
              fill="url(#legGrad)" stroke="#b76a20" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M 22 -7 C 68 -9 120 -7 148 -5" fill="none" stroke="#ffdcae" stroke-width="3.6" opacity=".4" stroke-linecap="round"/>
        <circle cx="0" cy="0" r="13" fill="#f4ab5e" stroke="#b76a20" stroke-width="2.4"/>
      </g>
    </g>

    <!-- 近侧曲柄（从五通沿 +x 画 48，整组按曲柄角旋转） -->
    <g id="nearCrank">
      <rect x="-14" y="-11" width="62" height="22" rx="11" fill="#c8d1de" stroke="#7d8797" stroke-width="2.2"/>
      <circle cx="0" cy="0" r="15" fill="#c8d1de" stroke="#7d8797" stroke-width="2"/>
      <circle cx="48" cy="0" r="7.5" fill="#aab3c1" stroke="#7d8797" stroke-width="1.8"/>
    </g>

    <!-- 近侧脚（原点在踝，踏板平台落在曲柄端，随脚保持水平） -->
    <g id="nearFoot">
      <rect x="-16" y="11" width="34" height="12" rx="5" fill="#5d6674" stroke="#3f4652" stroke-width="2"/>
      <path d="M -11 -6 C -14 -16 1 -20 17 -19 C 36 -17 52 -10 60 -2 C 62 1 58 4 54 2 C 38 -4 20 -6 6 -5 L -8 1 Z"
            fill="#f4ab5e" stroke="#b76a20" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M 2 -12 C 16 -16 38 -15 54 -8" fill="none" stroke="#ffdcae" stroke-width="3.4" opacity=".5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="11" fill="#f4ab5e" stroke="#b76a20" stroke-width="2.4"/>
    </g>
  </g>

  <!-- ==================== 前景（在自行车前面飞掠） ==================== -->
  <g id="foreground" clip-path="url(#roadClip)"></g>

  <!-- 速度线 -->
  <g id="streaks" stroke="#ffffff" stroke-linecap="round"></g>

  <!-- 大气透视 -->
  <rect x="0" y="644" width="1200" height="44" fill="url(#hazeGrad)"/>

  <!-- ==================== 覆盖层 ==================== -->
  <rect x="0" y="0" width="1200" height="800" fill="url(#warmLight)"/>
  <rect x="0" y="0" width="1200" height="800" fill="url(#vignette)"/>
  <rect x="0" y="0" width="1200" height="800" fill="none" stroke="#08131f" stroke-opacity=".35" stroke-width="30"/>
</svg>
</div>

<script>
(function () {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const DEG = Math.PI / 180;
  const TAU = Math.PI * 2;
  const byId = (id) => document.getElementById(id);
  const wrap = (v, span) => ((v % span) + span) % span;
  const el = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };

  /* =========================================================
     1. 车轮辐条
     ========================================================= */
  function spokes(target, count, radius) {
    for (let i = 0; i < count; i++) {
      const a = (360 / count) * i * DEG;
      target.appendChild(el('line', {
        x1: 0, y1: 0,
        x2: (radius * Math.cos(a)).toFixed(2),
        y2: (radius * Math.sin(a)).toFixed(2),
        opacity: i % 5 === 0 ? '0.95' : '0.55'
      }));
    }
  }
  spokes(byId('rearSpokes'), 20, 80);
  spokes(byId('frontSpokes'), 20, 80);

  /* =========================================================
     2. 云（各自漂移，无缝循环）
     ========================================================= */
  const CLOUD_SPAN = 1700;
  const clouds = [
    { x:   40, y: 118, s: 1.00, p: 0.30 },
    { x:  230, y:  82, s: 0.66, p: 0.22 },
    { x:  430, y: 156, s: 0.82, p: 0.36 },
    { x:  660, y: 100, s: 1.12, p: 0.26 },
    { x:  870, y: 190, s: 0.72, p: 0.42 },
    { x: 1060, y: 132, s: 0.94, p: 0.32 },
    { x: 1290, y:  96, s: 0.70, p: 0.24 },
    { x: 1500, y: 168, s: 0.86, p: 0.38 }
  ];
  const cloudG = byId('clouds');
  const cloudList = clouds.map((c) => {
    const g = el('g', { opacity: (0.42 + c.p * 0.9).toFixed(2) });
    [[0, 0, 74, 25], [42, -14, 50, 23], [-42, -12, 38, 17]].forEach((p) => {
      g.appendChild(el('ellipse', { cx: p[0], cy: p[1], rx: p[2], ry: p[3] }));
    });
    cloudG.appendChild(g);
    return { g, base: c.x, y: c.y, s: c.s, v: 26 + c.p * 120 };
  });

  /* =========================================================
     3. 远飞的海鸟
     ========================================================= */
  const farBirdsG = byId('farBirds');
  const farBirds = [
    { x: 262, y: 172, s: 1.00, ph: 0.0, v: 62 },
    { x: 318, y: 150, s: 0.76, ph: 1.9, v: 62 },
    { x: 366, y: 190, s: 0.62, ph: 3.4, v: 62 },
    { x: 1030, y: 296, s: 0.70, ph: 0.8, v: 62 },
    { x: 1088, y: 262, s: 0.56, ph: 2.6, v: 62 }
  ].map((b) => {
    const g = el('g');
    const l = el('path', { d: 'M -18 0 L 0 0' });
    const r = el('path', { d: 'M 0 0 L 18 0' });
    g.appendChild(l); g.appendChild(r);
    farBirdsG.appendChild(g);
    return { g, l, r, x: b.x, y: b.y, s: b.s, ph: b.ph, v: b.v };
  });

  /* =========================================================
     4. 路面景物（parallax）
        d = 0 位于地平线，d = 1 紧贴镜头
        baseY = 668 + d * 130      scale = 0.35 + d * 1.6
     ========================================================= */
  const SPAN = 1720;
  const SCENERY = [
    /* 远段：画在自行车后面 */
    { t: 'tuft',   x:   60, d: 0.00 },
    { t: 'pebble', x:  220, d: 0.04 },
    { t: 'flower', x:  380, d: 0.08 },
    { t: 'tuft',   x:  540, d: 0.02 },
    { t: 'pebble', x:  700, d: 0.06 },
    { t: 'flower', x:  860, d: 0.10 },
    { t: 'tuft',   x: 1020, d: 0.03 },
    { t: 'pebble', x: 1180, d: 0.07 },
    { t: 'tuft',   x: 1330, d: 0.11 },
    { t: 'flower', x: 1480, d: 0.05 },
    { t: 'grass',  x:  150, d: 0.14 },
    { t: 'tuft',   x:  470, d: 0.17 },
    { t: 'grass',  x:  800, d: 0.13 },
    { t: 'pebble', x: 1100, d: 0.16 },
    { t: 'grass',  x: 1360, d: 0.15 },
    /* 近段：画在自行车前面 */
    { t: 'grass',    x:  120, d: 0.36 },
    { t: 'rock',     x:  340, d: 0.46 },
    { t: 'grass',    x:  560, d: 0.40 },
    { t: 'flower',   x:  760, d: 0.34 },
    { t: 'crack',    x:  980, d: 0.55 },
    { t: 'pebble',   x: 1170, d: 0.38 },
    { t: 'grassBig', x:   40, d: 0.99 },
    { t: 'rock',     x:  250, d: 0.80 },
    { t: 'grassBig', x:  430, d: 0.93 },
    { t: 'crack',    x:  620, d: 0.72 },
    { t: 'grassBig', x:  830, d: 1.00 },
    { t: 'rock',     x: 1010, d: 0.86 },
    { t: 'grassBig', x: 1190, d: 0.95 }
  ];

  const SHAPES = {
    tuft: () =>
      '<g fill="none" stroke-linecap="round">' +
      '<path d="M 0 0 C -3 -12 -8 -19 -15 -23" stroke="#4f8a4a" stroke-width="3"/>' +
      '<path d="M 1 0 C 2 -15 4 -23 6 -29" stroke="#5fa055" stroke-width="3"/>' +
      '<path d="M 3 0 C 8 -13 15 -17 21 -19" stroke="#4f8a4a" stroke-width="3"/>' +
      '</g>',
    grass: () =>
      '<g fill="none" stroke-linecap="round">' +
      '<path d="M 0 0 C -6 -26 -16 -41 -28 -51" stroke="#4a8347" stroke-width="6"/>' +
      '<path d="M 2 0 C 0 -31 0 -51 4 -67" stroke="#5b9b52" stroke-width="6"/>' +
      '<path d="M 5 0 C 14 -27 28 -39 42 -45" stroke="#4a8347" stroke-width="6"/>' +
      '<path d="M -2 0 C -6 -19 -4 -31 2 -41" stroke="#6cae5e" stroke-width="4"/>' +
      '</g>',
    grassBig: () =>
      '<g fill="none" stroke-linecap="round">' +
      '<path d="M 0 0 C -15 -56 -39 -89 -68 -111" stroke="#376a3d" stroke-width="13"/>' +
      '<path d="M 6 0 C 2 -64 2 -107 10 -144" stroke="#3f7c42" stroke-width="13"/>' +
      '<path d="M 12 0 C 33 -56 64 -83 97 -97" stroke="#376a3d" stroke-width="13"/>' +
      '<path d="M -6 0 C -8 -35 -2 -60 10 -79" stroke="#4d914c" stroke-width="9"/>' +
      '</g>',
    flower: function () {
      let s = '<path d="M 0 0 C -2 -18 -4 -28 -6 -37" stroke="#4f8a4a" stroke-width="3" fill="none" stroke-linecap="round"/>';
      for (let i = 0; i < 5; i++) {
        const a = (-90 + i * 72) * DEG;
        s += '<circle cx="' + (-6 + 9 * Math.cos(a)).toFixed(1) + '" cy="' + (-41 + 9 * Math.sin(a)).toFixed(1) +
             '" r="5.4" fill="#fff3c4" stroke="#e8bd52" stroke-width="1.4"/>';
      }
      return s + '<circle cx="-6" cy="-41" r="4" fill="#ffd05e" stroke="#e0a63c" stroke-width="1.4"/>';
    },
    pebble: () =>
      '<ellipse cx="0" cy="-4" rx="11" ry="5" fill="#9aa3ae" stroke="#767f8a" stroke-width="1.6"/>' +
      '<ellipse cx="13" cy="0" rx="6" ry="3.4" fill="#8b949f" stroke="#767f8a" stroke-width="1.4"/>',
    rock: () =>
      '<path d="M -34 0 L -22 -22 L -4 -31 L 16 -20 L 26 -4 L 22 2 Z" fill="#8a919b" stroke="#5f676f" stroke-width="3" stroke-linejoin="round"/>' +
      '<path d="M -20 -18 L -4 -25 L 12 -16" fill="none" stroke="#b6bcc5" stroke-width="3" stroke-linecap="round"/>' +
      '<ellipse cx="34" cy="4" rx="14" ry="6" fill="#7c848e" stroke="#5f676f" stroke-width="2"/>',
    crack: () =>
      '<g fill="none" stroke="#343a42" stroke-linecap="round" opacity=".5">' +
      '<path d="M -90 0 L -40 -8 L 6 2 L 44 -6 L 96 6" stroke-width="4"/>' +
      '<path d="M -30 -7 L -22 -20 M 40 -5 L 52 -18" stroke-width="3.4"/></g>'
  };

  const nearG = byId('verge');
  const foreG = byId('foreground');

  SCENERY.forEach((it) => {
    const g = el('g');
    g.innerHTML = SHAPES[it.t]();
    (it.d < 0.30 ? nearG : foreG).appendChild(g);
    it.g = g;
    it.y = 668 + it.d * 130;
    it.s = 0.35 + it.d * 1.6;
    it.v = 240 + it.d * 1500;
  });

  /* =========================================================
     5. 中线虚线 & 速度线
     ========================================================= */
  const dashG = byId('dashes');
  const DASH_STRIDE = 152;
  const dashes = [];
  for (let i = 0; i < 12; i++) {
    const r = el('rect', { x: 0, y: 744, width: 88, height: 13, rx: 6.5 });
    dashG.appendChild(r);
    dashes.push(r);
  }

  const streakG = byId('streaks');
  const streaks = [];
  for (let i = 0; i < 16; i++) {
    const x = Math.random() * 1500;
    const len = 90 + Math.random() * 200;
    const line = el('line', {
      x1: x, x2: x + len,
      y1: 692 + Math.random() * 104, y2: 692,
      'stroke-width': 2 + Math.random() * 4,
      opacity: (0.08 + Math.random() * 0.2).toFixed(2)
    });
    line.setAttribute('y2', line.getAttribute('y1'));
    streakG.appendChild(line);
    streaks.push({ el: line, len, x, v: 620 + Math.random() * 950 });
  }

  /* =========================================================
     6. 两骨 IK：让双腿真实地踩踏
        每根骨头的绘图长度必须与下面的常量完全一致：
        股骨 80，胫骨 162，踝点位于踏板轴上方 ANKLE_UP。
     ========================================================= */
  const HIP = { x: 512, y: 396 };   // 髋关节（骨盆中心）
  const BB  = { x: 610, y: 568 };   // 五通（曲柄中心）
  const CRANK_R = 48;               // 曲柄臂长
  const ANKLE_UP = 16;              // 踝点相对踏板轴的高度
  const L1 = 80;                    // 股骨
  const L2 = 162;                   // 胫骨

  function solveLeg(phiDeg) {
    const phi = phiDeg * DEG;
    const pedal = { x: BB.x + CRANK_R * Math.cos(phi), y: BB.y + CRANK_R * Math.sin(phi) };
    const ankle = { x: pedal.x, y: pedal.y - ANKLE_UP };
    const dx = ankle.x - HIP.x, dy = ankle.y - HIP.y;
    // 留一点余量，保证膝盖不会完全锁死
    const d = Math.min(Math.hypot(dx, dy), L1 + L2 - 2);
    const psi = Math.atan2(dy, dx);
    const c = (d * d + L1 * L1 - L2 * L2) / (2 * d * L1);
    const a1 = Math.acos(Math.max(-1, Math.min(1, c)));
    // 固定取 psi + a1 这一支：膝关节向后弯（鸟类腿型），且始终落在身体轮廓之外
    const knee = { x: HIP.x + L1 * Math.cos(psi + a1), y: HIP.y + L1 * Math.sin(psi + a1) };
    // 骨头是各自独立旋转的元素，所以两段都用世界坐标系的绝对角度
    const thigh = Math.atan2(knee.y - HIP.y, knee.x - HIP.x) / DEG;
    const shin  = Math.atan2(ankle.y - knee.y, ankle.x - knee.x) / DEG;
    // 脚掌只保留很小的俯仰，踏面始终接近水平
    const foot = 8 * Math.cos(phi) - 3;
    return { pedal, ankle, knee, thigh, shin, foot };
  }

  function place(node, x, y, rotDeg) {
    const r = rotDeg * DEG, c = Math.cos(r), s = Math.sin(r);
    node.setAttribute('transform',
      'matrix(' + c.toFixed(5) + ' ' + s.toFixed(5) + ' ' + (-s).toFixed(5) + ' ' + c.toFixed(5) +
      ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ')');
  }

  const thighN = byId('nearThigh'), shinN = byId('nearShin'), footN = byId('nearFoot');
  const thighF = byId('farThigh'),  shinF = byId('farShin'),  footF = byId('farFoot');
  const crankN = byId('nearCrank'), crankF = byId('farCrank');
  const body = byId('body'), rig = byId('rig'), shadow = byId('shadow');
  const rearWheel = byId('rearWheel'), frontWheel = byId('frontWheel');
  const chainTop = byId('chainTopDash'), chainBot = byId('chainBotDash');

  /* =========================================================
     7. 主循环
     ========================================================= */
  const CRANK_DPS = 78 * 6;    // 踏频 78 rpm
  const WHEEL_DPS = 196 * 6;   // 车轮转速
  let crankAngle = 0;
  let wheelAngle = 0;
  let T = 0;
  let prev = performance.now();

  function frame(now) {
    let dt = (now - prev) / 1000;
    prev = now;
    if (dt > 0.1) dt = 0.1;
    T += dt;

    /* ---------- 踩踏 ---------- */
    crankAngle = (crankAngle + CRANK_DPS * dt) % 360;
    const near = solveLeg(crankAngle);
    const far  = solveLeg(crankAngle + 180);

    place(thighN, HIP.x, HIP.y, near.thigh);
    place(shinN, near.knee.x, near.knee.y, near.shin);
    place(footN, near.ankle.x, near.ankle.y, near.foot);
    place(thighF, HIP.x, HIP.y, far.thigh);
    place(shinF, far.knee.x, far.knee.y, far.shin);
    place(footF, far.ankle.x, far.ankle.y, far.foot);
    place(crankN, BB.x, BB.y, crankAngle);
    place(crankF, BB.x, BB.y, crankAngle + 180);

    /* ---------- 车轮 ---------- */
    wheelAngle = (wheelAngle + WHEEL_DPS * dt) % 360;
    const rot = 'rotate(' + wheelAngle.toFixed(2) + ')';
    rearWheel.setAttribute('transform', rot);
    frontWheel.setAttribute('transform', rot);

    /* ---------- 链条 ---------- */
    const off = (-(crankAngle * 2.8) % 11).toFixed(2);
    chainTop.setAttribute('stroke-dashoffset', off);
    chainBot.setAttribute('stroke-dashoffset', off);

    /* ---------- 身体：以髋关节为轴侧摆 + 轻微起伏 ---------- */
    const sway = 1.15 * Math.sin((crankAngle - 40) * DEG) + 0.3 * Math.sin(2 * crankAngle * DEG);
    const bob  = 2.1 * Math.sin(2 * crankAngle * DEG + 1.2) + 0.9 * Math.sin(T * 8.5);
    body.setAttribute('transform',
      'translate(0 ' + bob.toFixed(2) + ') ' +
      'translate(' + HIP.x + ' ' + HIP.y + ') rotate(' + sway.toFixed(3) + ') ' +
      'translate(' + (-HIP.x) + ' ' + (-HIP.y) + ')');

    /* ---------- 整车：踩踏反力带来的轻微晃动 ---------- */
    const rock = 0.4 * Math.sin((crankAngle + 30) * DEG);
    rig.setAttribute('transform',
      'translate(' + (2.2 * Math.sin((crankAngle - 90) * DEG)).toFixed(2) + ' ' +
                     (-1.5 * Math.abs(Math.sin(crankAngle * DEG))).toFixed(2) + ') ' +
      'translate(600 660) rotate(' + rock.toFixed(3) + ') translate(-600 -660)');

    /* ---------- 地面阴影呼吸 ---------- */
    const br = Math.sin((crankAngle - 90) * DEG);
    shadow.setAttribute('rx', (256 + 6 * br).toFixed(1));
    shadow.setAttribute('ry', (25 - 1.6 * br).toFixed(1));
    shadow.setAttribute('opacity', (0.28 + 0.05 * br).toFixed(3));

    /* ---------- 云 ---------- */
    for (let i = 0; i < cloudList.length; i++) {
      const c = cloudList[i];
      const x = wrap(c.base - T * c.v + 300, CLOUD_SPAN) - 300;
      c.g.setAttribute('transform',
        'translate(' + x.toFixed(1) + ' ' + (c.y + Math.sin(T * 0.4 + i) * 4).toFixed(1) + ') scale(' + c.s.toFixed(3) + ')');
    }

    /* ---------- 远处海鸟 ---------- */
    for (let i = 0; i < farBirds.length; i++) {
      const b = farBirds[i];
      const x = wrap(b.x - T * b.v + 300, CLOUD_SPAN) - 300;
      const flap = Math.sin(T * 5.2 + b.ph);
      b.g.setAttribute('transform',
        'translate(' + x.toFixed(1) + ' ' + (b.y + Math.sin(T * 1.6 + b.ph) * 7).toFixed(1) + ') scale(' + b.s.toFixed(3) + ')');
      b.l.setAttribute('d', 'M -18 ' + (flap * -8).toFixed(2) + ' Q -8 ' + (flap * 4).toFixed(2) + ' 0 0');
      b.r.setAttribute('d', 'M 0 0 Q 8 ' + (flap * 4).toFixed(2) + ' 18 ' + (flap * -8).toFixed(2));
    }

    /* ---------- 路面滚动 ---------- */
    for (let i = 0; i < SCENERY.length; i++) {
      const it = SCENERY[i];
      const x = wrap(it.x - T * it.v + 300, SPAN) - 300;
      it.g.setAttribute('transform',
        'translate(' + x.toFixed(1) + ' ' + (it.y + Math.sin(T * 2.4 + i * 1.7) * (0.8 + it.d * 3)).toFixed(1) + ') ' +
        'scale(' + it.s.toFixed(3) + ')');
    }

    /* ---------- 中线虚线 ---------- */
    for (let i = 0; i < dashes.length; i++) {
      dashes[i].setAttribute('x', (i * DASH_STRIDE - wrap(T * 1260, DASH_STRIDE)).toFixed(1));
    }

    /* ---------- 速度线 ---------- */
    for (let i = 0; i < streaks.length; i++) {
      const s = streaks[i];
      s.x -= s.v * dt;
      if (s.x + s.len < 0) { s.x = 1200 + Math.random() * 340; s.v = 620 + Math.random() * 950; }
      s.el.setAttribute('x1', s.x.toFixed(1));
      s.el.setAttribute('x2', (s.x + s.len).toFixed(1));
    }

    requestAnimationFrame(frame);
  }

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
